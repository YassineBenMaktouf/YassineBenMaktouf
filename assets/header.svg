<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Yassine Ben Maktouf, Junior Actuary and Data Science Engineer">
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F6EFDD"/>
      <stop offset="0.7" stop-color="#EEE5CF"/>
      <stop offset="1" stop-color="#DCCFAE"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#C4B28C" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <path id="wave" d="M0 0 q 25 -9 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" fill="none" stroke-linecap="round"/>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .route { stroke-dasharray: 2 9; animation: sail 6s linear infinite; }
      @keyframes sail { to { stroke-dashoffset: -110; } }
      .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 0 0; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
      .drift { animation: drift 5s linear infinite; }
      .drift2 { animation: drift 7s linear infinite reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-100px); } }
      .spin { animation: spin 40s linear infinite; transform-origin: 1040px 150px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade { animation: fade 1.6s ease-out both; }
      .fade2 { animation: fade 1.6s 0.5s ease-out both; }
      .fade3 { animation: fade 1.6s 1s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- paper and frame -->
  <rect width="1200" height="360" rx="14" fill="url(#paper)"/>
  <rect width="1200" height="360" rx="14" fill="url(#grid)"/>
  <rect x="12" y="12" width="1176" height="336" rx="8" fill="none" stroke="#7A5A26" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="320" rx="5" fill="none" stroke="#A8834A" stroke-width="0.8" stroke-dasharray="1 4"/>

  <!-- island silhouettes -->
  <g fill="#E3D6B6" stroke="#A8834A" stroke-width="1.2">
    <path d="M760 92c18-14 52-12 66 4 10 12-2 26-22 28-26 4-58-12-44-32z"/>
    <path d="M880 230c14-18 50-20 70-6 16 12 8 30-16 32-30 4-66-6-54-26z"/>
    <path d="M700 196c10-10 30-10 38 0 6 8-4 16-18 16-14 0-28-6-20-16z"/>
  </g>
  <g fill="none" stroke="#C4B28C" stroke-width="0.8">
    <path d="M748 92c20-26 70-24 88 0"/>
    <path d="M868 232c18-30 82-30 96 0"/>
  </g>

  <!-- dotted route between islands -->
  <path class="route" d="M600 250 C 660 230, 690 200, 718 202 S 780 150, 792 108 S 880 160, 912 226" fill="none" stroke="#8A2B33" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#8A2B33">
    <circle cx="792" cy="108" r="4"/>
    <circle cx="912" cy="226" r="4"/>
    <circle cx="718" cy="202" r="3"/>
  </g>

  <!-- compass rose -->
  <g class="spin">
    <circle cx="1040" cy="150" r="62" fill="none" stroke="#A8834A" stroke-width="1"/>
    <circle cx="1040" cy="150" r="54" fill="none" stroke="#C4B28C" stroke-width="0.8" stroke-dasharray="2 4"/>
    <g fill="#1C2B4A">
      <path d="M1040 92l8 50-8 8-8-8z"/>
      <path d="M1040 208l8-50-8-8-8 8z" fill="#A8834A"/>
      <path d="M982 150l50-8 8 8-8 8z" fill="#A8834A"/>
      <path d="M1098 150l-50-8-8 8 8 8z"/>
    </g>
    <g fill="#C4B28C" opacity="0.9">
      <path d="M1000 110l34 34-4 6-6-4z"/>
      <path d="M1080 110l-34 34 4 6 6-4z"/>
      <path d="M1000 190l34-34-4-6-6 4z"/>
      <path d="M1080 190l-34-34 4-6 6 4z"/>
    </g>
  </g>
  <text x="1040" y="78" text-anchor="middle" class="serif" font-size="18" fill="#1C2B4A">N</text>

  <!-- title block -->
  <g class="fade">
    <text x="64" y="70" class="mono" font-size="14" letter-spacing="4" fill="#7A5A26">THE VOYAGE · N 36°44′ · E 10°18′</text>
  </g>
  <g class="fade2">
    <text x="62" y="140" class="serif" font-size="62" fill="#1C2B4A">Yassine Ben Maktouf</text>
    <path d="M64 162 H560" stroke="#A8834A" stroke-width="1.5"/>
    <circle cx="566" cy="162" r="3" fill="#8A2B33"/>
  </g>
  <g class="fade3">
    <text x="64" y="200" class="serif" font-size="26" font-style="italic" fill="#2C3A57">Junior Actuary &amp; Data Science Engineer</text>
    <text x="64" y="236" class="mono" font-size="15" fill="#6E6448">risk models · GLM pricing · mortality · ML · NLP · RAG</text>
  </g>

  <!-- sea -->
  <g transform="translate(0 292)">
    <g class="drift"><use href="#wave" stroke="#A8834A" stroke-width="1.6" opacity="0.7"/></g>
  </g>
  <g transform="translate(-30 310)">
    <g class="drift2"><use href="#wave" stroke="#C4B28C" stroke-width="1.4" opacity="0.8"/></g>
  </g>
  <g transform="translate(-10 326)">
    <g class="drift"><use href="#wave" stroke="#A8834A" stroke-width="1" opacity="0.45"/></g>
  </g>

  <!-- boat -->
  <g transform="translate(560 262)">
    <g class="bob">
      <path d="M-34 18 H34 L24 32 H-24 Z" fill="#7A5A26" stroke="#5C4219" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 18 V-40" stroke="#5C4219" stroke-width="2.5"/>
      <path d="M2 -38 Q 30 -14 26 14 H2 Z" fill="#F6EFDD" stroke="#1C2B4A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-2 -30 Q -22 -8 -20 14 H-2 Z" fill="#F4ECD8" stroke="#1C2B4A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 -40 L14 -36 L0 -32 Z" fill="#8A2B33"/>
    </g>
  </g>
</svg>
